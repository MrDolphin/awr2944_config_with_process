# Raspberry Pi UVC camera capture contract.
# This is the validated stable symlink and the proven MJPEG mode from the
# environment baseline. Do not replace it with an unstable /dev/videoN path.
device=/dev/v4l/by-id/usb-TSTC_USB20_WEB_CAMERA_TSTC_USB20_WEB_CAMERA_01.00.00-video-index0
width=1280
height=720
fps=30
input_format=mjpeg
