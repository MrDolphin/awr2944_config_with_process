# Raspberry Pi 4B UM982/RTK 运行配置模板
# 复制此文件为 config.ini 后修改账号密码等信息。
# config.ini 已加入 .gitignore，不会被提交到仓库。

[MODE]
# 工作模式（目标模式，不是当前实际定位状态）
# 可选值:
#   SINGLE = 单点定位。不连接 NTRIP，关闭 DGPS 和 RTK 引擎。
#            仅用伪距解算，精度约 1-3 米，适合粗定位或无网络场景。
#   DGPS   = 差分定位。连接 NTRIP 获取码差分改正数，开启 DGPS 引擎。
#            精度约 0.5-1 米，适合不需要厘米级的场合。
#   RTK    = 实时动态定位。连接 NTRIP 并注入 RTCM 载波相位改正数，
#            开启 DGPS + RTK 双引擎。固定解可达厘米级，
#            浮点解约 0.5 米。需要开阔天空和稳定网络。
type = RTK

[SERIAL]
# 串口设备路径。
# 设为 auto 表示每次启动自动探测；探测到后会自动写回此字段。
# 手动固定时改为具体路径（如 /dev/ttyUSB0）并设 auto_on_start = false。
port = auto

# 是否每次启动都自动探测串口。
# true  = 每次启动都扫描候选串口（推荐，即插即用）。
# false = 使用下方 port 字段的固定路径，不再探测。
auto_on_start = true

# 自动探测到 UM982 后是否把结果写回 port 字段保存。
save_detected_port = true

# 串口波特率。UM982 默认出厂 115200，一般不需要改。
baudrate = 115200

# 串口读超时（秒）。影响 readline() 的阻塞时间。
timeout = 1

# 自动探测时的候选通配符模式列表（逗号分隔）。
candidate_patterns = /dev/ttyUSB*, /dev/ttyACM*, /dev/ttyAMA*

# 排除的串口列表（逗号分隔）。
# 树莓派上 /dev/ttyACM0 是雷达 CLI、/dev/ttyACM1 是雷达 Data，必须排除。
exclude_ports = /dev/ttyACM0, /dev/ttyACM1

# 单个串口的探测超时（秒）。
probe_timeout = 1.2

# 整个探测过程的总超时（秒），超过后放弃并报错。
detect_timeout = 10

# RTCM 注入串口。
# 留空 = 通过同一个 GNSS 串口注入（最常用）。
# 填写路径 = 用独立串口注入 RTCM（如接收机有双串口时）。
injection_port =

[RECEIVER]
# UM982 工作剖面名。
# 留空 = 使用默认 MODE ROVER（移动站模式）。
# 可选: SURVEY 基站模式、ROVER 移动站模式等，一般留空即可。
rover_profile =

# NMEA 输出版本。
# V410 = NMEA 0183 v4.10（默认，支持多星座）。
# V411 = NMEA 0183 v4.11。
nmea_version = V410

# 各 NMEA 语句输出频率（单位：秒/次，1 = 每秒一条，0 = 关闭）。
gga_rate = 1
rmc_rate = 1
gsa_rate = 1
gsv_rate = 1

# DGPS 引擎超时时间（秒）。
# 超过此时间没有收到有效差分改正数则回退到单点。
# SINGLE 模式下程序会自动设为 0（关闭引擎）。
dgps_timeout = 300

# RTK 引擎超时时间（秒）。
# 超过此时间没有收敛到固定解则回退到浮点或更低的解。
# SINGLE/DGPS 模式下程序会自动设为 0（关闭引擎）。
rtk_timeout = 600

# 卫星高度截止角（度）。
# 低于此仰角的卫星不参与解算，用于过滤多径严重的低仰角信号。
# 范围 -90 到 +90 度。
#   10 = 默认值，保留更多卫星但可能引入低仰角多径。
#   15 = 推荐值，适合半室外或有遮挡的场景。
#   20 = 保守值，适合严重遮挡环境，可用卫星数减少。
#   30 = 极端保守，仅适合非常开阔的天空。
# 注意：截止角越高，可用卫星越少，HDOP 可能变差；
#       但多径干扰也越少，模糊度固定概率越高。
elevation_mask = 15

# 是否发送 SAVECONFIG 让接收机掉电保存当前配置。
# true  = 发送 SAVECONFIG，重启接收机后配置仍在。
# false = 不保存，每次由本程序重新下发（推荐，避免残留状态）。
save_config = false

[NTRIP]
# 是否启用 NTRIP 差分数据连接。
# SINGLE 模式下设为 false 或忽略此段；DGPS/RTK 必须为 true。
enabled = true

# 千寻位置服务 NTRIP caster 地址。
host = 203.107.45.154

# 端口号与坐标系对应关系：
#   8001 = ITRF2008
#   8002 = WGS84（推荐，与 GPS 原始坐标一致）
#   8003 = CGCS2000
port = 8002

# 接入点名称。
#   AUTO        = 五星十六频，自动选择最优方案（推荐）。
#   RTCM32_GGB  = 三星八频，GPS+BDS+GLONASS。
#   RTCM30_GG   = 双星，GPS+GLONASS。
mountpoint = AUTO

# 千寻账号和密码（请替换为你自己的账号）。
username = your_qianxun_user
password = your_qianxun_password

# NTRIP 连接建立前的兜底 GGA 语句（经纬度为粗略参考点）。
# 程序优先等待真实 GGA 再回发，仅在网络极慢时才用到此值。
gga_fallback = $GNGGA,120000.00,3000.0000,N,12000.0000,E,1,8,1.0,10.0,M,0.0,M,,*49

[OUTPUT]
# 会话数据输出目录（相对于 config.ini 所在目录，也可填绝对路径）。
# 每次运行会在其下创建 YYYYMMDD_HHMMSS 子目录。
directory = output

# 是否保存原始 NMEA/Unicore 文本日志。
raw_log = true

[RTK]
# 从进入浮点解开始等待固定解的超时时间（秒）。
# 超过后如果仍未固定则保持浮点解继续采集。
fix_timeout = 25

# 判定"进入固定解"所需的最少连续历元数。
# 防止偶发跳变被误判为稳定固定。
min_fixed_epochs = 8

[SERVICE]
# 状态打印间隔（秒），影响终端 [state] 行的刷新频率。
status_interval = 3

# 采集时长（秒）。
# 0    = 不限时长，持续运行直到 Ctrl+C 或 systemd stop。
# >0   = 到达指定秒数后自动停止并写 manifest。
duration = 0
